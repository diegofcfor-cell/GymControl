# Reverb (WebSockets) corre en 127.0.0.1:8080 dentro del contenedor. El navegador se conecta a wss://<dominio>/app/...
# y Apache le pasa la conexión: así funciona en Render, que expone un solo puerto por servicio.
ProxyPass        "/app/" "ws://127.0.0.1:8080/app/"
ProxyPassReverse "/app/" "ws://127.0.0.1:8080/app/"
